<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Admin Portal 🌙</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #0d0f12; color: #f3f4f6; font-family: 'Cairo', 'Inter', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0d0f12; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #10b981, #6366f1); border-radius: 2px; }
    
    /* Smooth scrolling */
    html { scroll-behavior: smooth; }
    
    /* Selection styling */
    ::selection { background: rgba(16, 185, 129, 0.3); color: #fff; }
    
    /* Premium emoji rendering */
    .emoji { font-size: inherit; line-height: 1; }
    
    /* Better focus styles */
    *:focus-visible { outline: 2px solid rgba(16, 185, 129, 0.5); outline-offset: 2px; border-radius: 8px; }
    
    /* Shimmer for loading */
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .shimmer { background: linear-gradient(90deg, #161922 25%, #1f2430 50%, #161922 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    
    /* Page transition */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.3s ease-out; }

    /* Anti-black-screen splash — shown instantly before JS loads */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: radial-gradient(120% 100% at 50% 0%, #131720 0%, #0b0d12 60%, #07080c 100%);
      color: #fff; font-family: 'Cairo', sans-serif; text-align: center; padding: 24px;
    }
    #splash .icon { font-size: 44px; animation: splashFloat 1.4s ease-in-out infinite; }
    #splash .bar { width: 130px; height: 4px; border-radius: 99px; background: #1c2230; overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 40%; border-radius: 99px; background: linear-gradient(90deg,#10b981,#3b82f6); animation: splashLoad 1.1s ease-in-out infinite; }
    #splash p { font-size: 12px; color: #8b93a7; font-weight: 700; }
    #splash.hidden { opacity: 0; visibility: hidden; transition: opacity .3s ease; }
    @keyframes splashFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes splashLoad { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="icon">🛡️</div>
    <div class="bar"><i></i></div>
    <p>ADMIN PORTAL — LOADING...</p>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

</body>
</html>
